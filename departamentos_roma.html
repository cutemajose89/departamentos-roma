<script>

function t(key){ return I18N[currentLang][key] || key; }

function applyStaticTranslations(){
  document.documentElement.lang = currentLang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    el.textContent = t(key);
  });
  document.getElementById('langToggle').textContent = t('langBtn');
  document.getElementById('saveBtn').textContent = editingId ? t('btnSaveEdit') : t('btnSave');
}

document.getElementById('langToggle').addEventListener('click', ()=>{
  currentLang = currentLang === 'es' ? 'it' : 'es';
  applyStaticTranslations();
  render();
  renderZonas();
  if(currentLang === 'it'){
    listings.filter(l => l.notes && !l.notes_it).forEach(l => translateAndUpdate(l.id, l.notes));
  }
});

/* ====================== Claude translation helper ====================== */
async function translateText(text, targetLang){
  if(!text || !text.trim()) return '';
  const targetName = targetLang === 'it' ? 'Italian' : 'Spanish';
  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 300,
        messages: [{
          role: "user",
          content: `Translate the following short real-estate listing note into ${targetName}. Reply with ONLY the translation, no preamble, no quotes:\n\n${text}`
        }]
      })
    });
    const data = await response.json();
    const block = (data.content || []).find(b => b.type === 'text');
    return block ? block.text.trim() : text;
  }catch(e){
    return text;
  }
}

/* ====================== Helpers ====================== */
function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function parsePrice(p){
  if(!p) return NaN;
  const n = String(p).replace(/[^\d]/g,'');
  return n ? parseInt(n,10) : NaN;
}

function setStatus(msg, isError){
  const el = document.getElementById('status');
  el.textContent = msg || '';
  el.style.color = isError ? 'var(--brick)' : 'var(--ink-dim)';
  if(msg){ setTimeout(()=>{ if(el.textContent===msg) el.textContent=''; }, 2600); }
}

/* ====================== Airtable <-> app mapping ====================== */
function recordToListing(rec){
  const f = rec.fields || {};
  return {
    id: rec.id,
    addr: f['Dirección'] || '',
    zona: f['Barrio'] || '',
    price: f['Precio'] != null ? String(f['Precio']) : '',
    rooms: f['Recámaras'] != null ? String(f['Recámaras']) : '',
    link: f['Enlace'] || '',
    notes: f['Notas'] || '',
    notes_it: f['Notas_IT'] || '',
    addedAt: rec.createdTime ? new Date(rec.createdTime).getTime() : Date.now(),
  };
}

function listingToFields(entry){
  const fields = {
    'Dirección': entry.addr || '',
    'Barrio': entry.zona || '',
    'Enlace': entry.link || '',
    'Notas': entry.notes || '',
  };
  const price = parsePrice(entry.price);
  if(!isNaN(price)) fields['Precio'] = price;
  const rooms = parseInt(entry.rooms, 10);
  if(!isNaN(rooms)) fields['Recámaras'] = rooms;
  if(entry.notes_it) fields['Notas_IT'] = entry.notes_it;
  return fields;
}

/* ====================== Load / Save via Airtable REST API ====================== */
async function loadListings(){
  document.getElementById('loadingState').style.display = 'block';
  try{
    let all = [];
    let offset = null;
    do {
      const url = new URL(AIRTABLE_URL);
      url.searchParams.set('pageSize', '100');
      if(offset) url.searchParams.set('offset', offset);
      const res = await fetch(url.toString(), { headers: airtableHeaders() });
      if(!res.ok) throw new Error('Airtable fetch failed: ' + res.status);
      const data = await res.json();
      all = all.concat((data.records || []).map(recordToListing));
      offset = data.offset;
    } while(offset);
    listings = all;

    if(listings.length === 0){
      await seedPreviousListings();
    }
  }catch(e){
    setStatus(t('errLoad'), true);
    listings = [];
  }
  document.getElementById('loadingState').style.display = 'none';
  render();
}

// in the earlier (non-Airtable) version of the catasto, so nothing gets lost.

      rooms: '3',
      link: 'https://www.immobiliare.it/en/annunci/131501434/',
      notes: 'Favorito. 3 habitaciones (una tipo estudio), edificio sin ascensor, junto al Tíber.',
      notes_it: 'Preferito. 3 camere (una tipo studio), edificio senza ascensore, vicino al Tevere.',
    },
    {
      addr: 'Piazza di San Egidio',
      zona: 'Trastevere',
      price: '2600',
      rooms: '2',
      link: 'https://www.idealista.it/immobile/19278529/',
      notes: '120 m², elegantemente renovado, en una de las plazas más bonitas de Trastevere.',
      notes_it: '120 m², elegantemente ristrutturato, in una delle piazze più belle di Trastevere.',
    },
    {
      addr: 'Via Giulia',
      zona: "Campo de' Fiori",
      price: '2600',
      rooms: '2',
      link: 'https://www.idealista.it/immobile/36167114/',
      notes: '100 m², 2do piso con ascensor, vistas a Piazza delle Moretta recién restaurada.',
      notes_it: '100 m², 2° piano con ascensore, vista su Piazza delle Moretta appena restaurata.',
    },
  ];
  for(const item of pending){
    try{
      const created = await createListing(item);
      listings.unshift(created);
    }catch(e){ /* skip on failure, keep going with the rest */ }
  }
}

async function createListing(entry){
  const res = await fetch(AIRTABLE_URL, {
    method: 'POST',
    headers: airtableHeaders(),
    body: JSON.stringify({ fields: listingToFields(entry) })
  });
  if(!res.ok) throw new Error('Airtable create failed: ' + res.status);
  return recordToListing(await res.json());
}

async function updateListing(id, entry){
  const res = await fetch(`${AIRTABLE_URL}/${id}`, {
    method: 'PATCH',
    headers: airtableHeaders(),
    body: JSON.stringify({ fields: listingToFields(entry) })
  });
  if(!res.ok) throw new Error('Airtable update failed: ' + res.status);
  return recordToListing(await res.json());
}

async function deleteListingRemote(id){
  const res = await fetch(`${AIRTABLE_URL}/${id}`, {
    method: 'DELETE',
    headers: airtableHeaders()
  });
  if(!res.ok) throw new Error('Airtable delete failed: ' + res.status);
}

/* ====================== Actions ====================== */
async function addListing(entry){
  try{
    const created = await createListing(entry);
    listings.unshift(created);
    render();
    setStatus(t('savedMsg'));
    translateAndUpdate(created.id, created.notes);
  }catch(e){
    setStatus(t('errSave'), true);
  }
}

async function editListing(id, entry){
  try{
    const idx = listings.findIndex(x=>x.id===id);
    const notesChanged = idx>-1 && listings[idx].notes !== entry.notes;
    if(notesChanged) entry.notes_it = '';
    const updated = await updateListing(id, entry);
    if(idx>-1) listings[idx] = updated;
    render();
    setStatus(t('editedMsg'));
    if(notesChanged) translateAndUpdate(id, updated.notes);
  }catch(e){
    setStatus(t('errSave'), true);
  }
}

async function removeListing(id){
  try{
    await deleteListingRemote(id);
    listings = listings.filter(l => l.id !== id);
    render();
    setStatus(t('removedMsg'));
  }catch(e){
    setStatus(t('errSave'), true);
  }
}

async function translateAndUpdate(id, sourceNotes){
  if(!sourceNotes || !sourceNotes.trim()) return;
  const notes_it = await translateText(sourceNotes, 'it');
  const idx = listings.findIndex(x=>x.id===id);
  if(idx>-1 && notes_it){
    listings[idx].notes_it = notes_it;
    try{
      await fetch(`${AIRTABLE_URL}/${id}`, {
        method: 'PATCH',
        headers: airtableHeaders(),
        body: JSON.stringify({ fields: { 'Notas_IT': notes_it } })
      });
    }catch(e){ /* silent — will retry next time notes are viewed */ }
    render();
  }
}

/* ====================== Render ====================== */
function render(){
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  const countNum = document.getElementById('countNum');
  countNum.textContent = listings.length;

  if(listings.length === 0){
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  const sortVal = document.getElementById('sortSel').value;
  let items = [...listings];
  if(sortVal === 'price-asc'){
    items.sort((a,b)=> (parsePrice(a.price)||Infinity) - (parsePrice(b.price)||Infinity));
  } else if(sortVal === 'price-desc'){
    items.sort((a,b)=> (parsePrice(b.price)||-Infinity) - (parsePrice(a.price)||-Infinity));
  } else {
    items.sort((a,b)=> (b.addedAt||0) - (a.addedAt||0));
  }

  grid.innerHTML = items.map(l => {
    const zona = escapeHtml(l.zona || 'Roma');
    const addr = escapeHtml(l.addr || '—');
    const priceRaw = (l.price||'').toString().trim();
    const price = priceRaw ? (priceRaw.match(/€/) ? priceRaw : '€ ' + priceRaw + t('perMonth')) : t('priceUnset');
    const rooms = l.rooms ? escapeHtml(l.rooms) + ' ' + t('rooms') : '';
    const link = l.link ? escapeHtml(l.link) : '';
    const isTranslating = currentLang === 'it' && l.notes && !l.notes_it;
    const notes = escapeHtml(currentLang === 'it' ? (l.notes_it || l.notes || '') : (l.notes || ''));
    return `
      <div class="card">
        <div class="plaque">
          <div class="rione">${t('rione')}</div>
          <div class="zona">${zona}</div>
        </div>
        <div class="body">
          <div class="body-top">
            <div class="addr">${addr}</div>
            <div class="price">${escapeHtml(price)}</div>
          </div>
          ${rooms ? `<div class="meta">${rooms}</div>` : ''}
          ${notes ? `<div class="notes">${notes}${isTranslating ? ' <span style="opacity:0.5;font-style:normal;">(…)</span>' : ''}</div>` : ''}
          <div class="row-actions">
            ${link ? `<a class="link" href="${link}" target="_blank" rel="noopener">${t('viewListing')}</a>` : `<span class="link" style="opacity:0.4;cursor:default;border:none;">${t('noLink')}</span>`}
            <span style="display:flex;gap:14px;">
              <button class="remove" data-edit="${l.id}">${t('edit')}</button>
              <button class="remove" data-id="${l.id}">${t('remove')}</button>
            </span>
          </div>
        </div>
      </div>
    `;
  }).join('');

  grid.querySelectorAll('.remove[data-id]').forEach(btn=>{
    btn.addEventListener('click', ()=> removeListing(btn.dataset.id));
  });
  grid.querySelectorAll('.remove[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=> startEdit(btn.dataset.edit));
  });
}

function startEdit(id){
  const l = listings.find(x=>x.id===id);
  if(!l) return;
  editingId = id;
  document.getElementById('f-addr').value = l.addr || '';
  document.getElementById('f-zona').value = l.zona || '';
  document.getElementById('f-price').value = l.price || '';
  document.getElementById('f-rooms').value = l.rooms || '';
  document.getElementById('f-link').value = l.link || '';
  document.getElementById('f-notes').value = l.notes || '';
  document.getElementById('saveBtn').textContent = t('btnSaveEdit');
  document.getElementById('addCard').open = true;
  document.querySelector('.add-card summary').scrollIntoView({behavior:'smooth', block:'center'});
}

/* ====================== Form wiring ====================== */
document.getElementById('saveBtn').addEventListener('click', async ()=>{
  const addr = document.getElementById('f-addr').value.trim();
  if(!addr){ setStatus(t('errAddr'), true); return; }
  const fields = {
    addr,
    zona: document.getElementById('f-zona').value.trim(),
    price: document.getElementById('f-price').value.trim(),
    rooms: document.getElementById('f-rooms').value.trim(),
    link: document.getElementById('f-link').value.trim(),
    notes: document.getElementById('f-notes').value.trim(),
  };
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  if(editingId){
    await editListing(editingId, fields);
    editingId = null;
    document.getElementById('saveBtn').textContent = t('btnSave');
  } else {
    await addListing(fields);
  }
  btn.disabled = false;
  ['f-addr','f-zona','f-price','f-rooms','f-link','f-notes'].forEach(id=> document.getElementById(id).value='');
  document.getElementById('addCard').open = false;
});

document.getElementById('cancelBtn').addEventListener('click', ()=>{
  ['f-addr','f-zona','f-price','f-rooms','f-link','f-notes'].forEach(id=> document.getElementById(id).value='');
  document.getElementById('addCard').open = false;
  editingId = null;
  document.getElementById('saveBtn').textContent = t('btnSave');
});

document.getElementById('sortSel').addEventListener('change', render);

/* ====================== Init ====================== */
/* ====================== Zonas de interés ====================== */
let zonas = []; // [{id, nombre}]

async function loadZonas(){
  try{
    let all = [];
    let offset = null;
    do {
      const url = new URL(AIRTABLE_ZONAS_URL);
      url.searchParams.set('pageSize', '100');
      if(offset) url.searchParams.set('offset', offset);
      const res = await fetch(url.toString(), { headers: airtableHeaders() });
      if(!res.ok) throw new Error('Zonas fetch failed: ' + res.status);
      const data = await res.json();
      all = all.concat((data.records || []).map(r => ({ id: r.id, nombre: (r.fields||{})['Barrio'] || '' })));
      offset = data.offset;
    } while(offset);
    zonas = all;
  }catch(e){
    zonas = [];
  }
  renderZonas();
}

function renderZonas(){
  const wrap = document.getElementById('zonasList');
  wrap.innerHTML = zonas.map(z => `
    <span style="display:inline-flex; align-items:center; gap:8px; background:var(--charcoal); border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink);">
      ${escapeHtml(z.nombre)}
      <button data-zona-id="${z.id}" style="background:none;border:none;color:var(--ink-dim);cursor:pointer;font-size:11px;padding:0;" title="${t('zonaRemove')}">✕</button>
    </span>
  `).join('');
  wrap.querySelectorAll('[data-zona-id]').forEach(btn=>{
    btn.addEventListener('click', ()=> removeZona(btn.dataset.zonaId));
  });
}

async function addZona(nombre){
  try{
    const res = await fetch(AIRTABLE_ZONAS_URL, {
      method: 'POST',
      headers: airtableHeaders(),
      body: JSON.stringify({ fields: { 'Barrio': nombre } })
    });
    if(!res.ok) throw new Error('Zona create failed: ' + res.status);
    const rec = await res.json();
    zonas.push({ id: rec.id, nombre });
    renderZonas();
    setStatus(t('zonaAdded'));
  }catch(e){
    setStatus(t('errSave'), true);
  }
}

async function removeZona(id){
  try{
    await fetch(`${AIRTABLE_ZONAS_URL}/${id}`, { method: 'DELETE', headers: airtableHeaders() });
    zonas = zonas.filter(z => z.id !== id);
    renderZonas();
  }catch(e){
    setStatus(t('errSave'), true);
  }
}

document.getElementById('addZonaBtn').addEventListener('click', ()=>{
  const input = document.getElementById('f-zona-nueva');
  const val = input.value.trim();
  if(!val){ setStatus(t('errZonaEmpty'), true); return; }
  addZona(val);
  input.value = '';
});
document.getElementById('f-zona-nueva').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){ document.getElementById('addZonaBtn').click(); }
});

applyStaticTranslations();
loadListings();
loadZonas();
</script>
